<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ペンライト</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    touch-action: none;
    background: #111;
    transition: background-color 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
</style>
</head>
<body>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDLLfiNG-WMhcbKfAFOMHKkPMS3kBjUpP0",
  authDomain: "penlight-ec75d.firebaseapp.com",
  databaseURL: "https://penlight-ec75d-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "penlight-ec75d",
  storageBucket: "penlight-ec75d.firebasestorage.app",
  messagingSenderId: "639204423241",
  appId: "1:639204423241:web:51cbe1fd475e823d747198"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

onValue(ref(db, 'penlight/current'), (snapshot) => {
  if (!snapshot.exists()) return;
  const color = snapshot.val().color || '#111111';
  document.body.style.backgroundColor = color;
});

async function keepScreenOn() {
  if ('wakeLock' in navigator) {
    try { await navigator.wakeLock.request('screen'); } catch(e) {}
  }
}
keepScreenOn();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') keepScreenOn();
});
</script>
</body>
</html>
